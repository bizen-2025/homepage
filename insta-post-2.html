<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BIZEN Instagram Post 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: #0a1628; }

        .post {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 60px;
            position: relative;
            overflow: hidden;
        }

        .post::before {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 140px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px rgba(96, 165, 250, 0.4));
        }

        .title {
            font-size: 52px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 26px;
            color: #60A5FA;
            font-weight: 600;
        }

        .fund-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .fund-item {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            padding: 35px 30px;
            text-align: center;
            transition: all 0.3s;
        }

        .fund-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .fund-name {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .fund-desc {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }

        .bottom-cta {
            position: absolute;
            bottom: 60px;
            font-size: 24px;
            color: #93C5FD;
            font-weight: 600;
        }

        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, transparent, #3B82F6, #60A5FA, #3B82F6, transparent);
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="top-line"></div>
        <div class="header">
            <img src="로고화이트 복사.png" alt="BIZEN" class="logo">
            <h1 class="title">정책자금 종류</h1>
            <p class="subtitle">기업 성장 단계별 맞춤 자금</p>
        </div>
        <div class="fund-grid">
            <div class="fund-item">
                <div class="fund-icon">🚀</div>
                <div class="fund-name">창업자금</div>
                <div class="fund-desc">초기 창업기업 지원</div>
            </div>
            <div class="fund-item">
                <div class="fund-icon">🏭</div>
                <div class="fund-name">시설자금</div>
                <div class="fund-desc">설비·시설 투자 지원</div>
            </div>
            <div class="fund-item">
                <div class="fund-icon">💼</div>
                <div class="fund-name">운전자금</div>
                <div class="fund-desc">경영 안정화 지원</div>
            </div>
            <div class="fund-item">
                <div class="fund-icon">🔬</div>
                <div class="fund-name">R&D자금</div>
                <div class="fund-desc">연구개발 투자 지원</div>
            </div>
        </div>
        <p class="bottom-cta">📞 1668-3166 무료상담</p>
    </div>
</body>
</html>
